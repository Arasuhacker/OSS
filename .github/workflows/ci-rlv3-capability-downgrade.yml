name: isolated-chia-rlv3-capability-downgrade

on:
  push:
    branches: [ci-rlv3-6f4a9d]
    paths-ignore: ['ci/results/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capability-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-rlv3-6f4a9d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libssl-dev pkg-config
          git clone --filter=blob:none https://github.com/Chia-Network/chia-blockchain.git target
          git -C target checkout d61ed07dee7e9f846b475184db29e885f4699d2a
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './target[dev]'
      - name: Execute capability downgrade engine
        id: campaign
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/target
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python ci/rlv3_capability_downgrade_fuzzer.py 2>&1 | tee CAPABILITY.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish result
        if: always()
        run: |
          mkdir -p ci/results
          {
            echo "target_commit=d61ed07dee7e9f846b475184db29e885f4699d2a"
            echo "exit_code=${{ steps.campaign.outputs.exit_code }}"
            grep -E 'RATE_CAPABILITIES=|PROCESS_SIGNATURE=|DOWNGRADE=|SOURCE_HITS=|FINDING_COUNT=|SECURITY_RELEVANT_COUNT=|RESULT=|Traceback|ERROR' CAPABILITY.log 2>/dev/null | tail -n 260 || true
            echo '--- tail ---'
            tail -n 220 CAPABILITY.log 2>/dev/null || true
          } > ci/results/rlv3-capability-downgrade.txt
          cp RLV3_CAPABILITY_DOWNGRADE_RESULTS.json ci/results/rlv3-capability-downgrade.json 2>/dev/null || true
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/results/rlv3-capability-downgrade.txt ci/results/rlv3-capability-downgrade.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record capability downgrade campaign [skip ci]'
            git push origin HEAD:ci-rlv3-6f4a9d
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlv3-capability-downgrade-evidence
          path: |
            CAPABILITY.log
            RLV3_CAPABILITY_DOWNGRADE_RESULTS.json
            ci/results/rlv3-capability-downgrade.txt
          retention-days: 7
