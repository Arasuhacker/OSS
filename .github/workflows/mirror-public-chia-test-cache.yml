name: Mirror public Chia test plots

on:
  push:
    paths:
      - .github/workflows/mirror-public-chia-test-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Chia public test cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf cache-download test-plots-public
          mkdir -p cache-download test-plots-public
          cd cache-download
          gh release download -R Chia-Network/test-cache 0.45.32 --archive=tar.gz -O cache.tar.gz
          tar xzf cache.tar.gz
          cd ..
          found=$(find cache-download -type d -path '*/.chia/test-plots' | head -n1)
          test -n "$found"
          cp -a "$found"/. test-plots-public/
          printf '%s\n' "$GITHUB_RUN_ID" > test-plots-public/RUN_ID.txt
          find test-plots-public -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > test-plots-public/SHA256SUMS.txt

      - name: Upload public test plots
        uses: actions/upload-artifact@v4
        with:
          name: public-chia-test-plots
          path: test-plots-public/
          if-no-files-found: error

      - name: Publish artifact run identifier
        run: |
          run_id="$GITHUB_RUN_ID"
          rm -rf /tmp/test-plot-index
          mkdir -p /tmp/test-plot-index/test-plots-index
          printf '%s\n' "$run_id" > /tmp/test-plot-index/test-plots-index/RUN_ID.txt
          cd /tmp/test-plot-index
          git init
          git config user.name 'public-dependency-mirror'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b public-test-plots-index
          git add test-plots-index
          git commit -m 'Publish Chia public test plots artifact index'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-test-plots-index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
