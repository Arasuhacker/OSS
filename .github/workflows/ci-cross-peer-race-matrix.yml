name: isolated-chia-cross-peer-race-matrix

on:
  push:
    branches: [ci-rlv3-6f4a9d]
    paths-ignore: ['ci/results/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cross-peer-race:
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: main-pinned
            ref: d61ed07dee7e9f846b475184db29e885f4699d2a
          - name: release-2.7.3
            ref: release/2.7.3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-rlv3-6f4a9d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libssl-dev pkg-config
          git clone --filter=blob:none https://github.com/Chia-Network/chia-blockchain.git target
          git -C target checkout '${{ matrix.target.ref }}'
          git -C target rev-parse HEAD > TARGET_COMMIT.txt
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './target[dev]'
      - name: Execute real API sequence
        id: campaign
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/target
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python ci/cross_peer_tx_race_poc.py 2>&1 | tee CROSS_PEER_RACE.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Stage result
        if: always()
        run: |
          mkdir -p race-results
          {
            echo "target=${{ matrix.target.name }}"
            echo "ref=${{ matrix.target.ref }}"
            echo "commit=$(cat TARGET_COMMIT.txt 2>/dev/null)"
            echo "exit_code=${{ steps.campaign.outputs.exit_code }}"
            grep -E 'PENDING_ATTRIBUTE=|PENDING_CONTAINER=|EVIDENCE=|NEGATIVE_CONTROL|NODE_REQUESTED|ATTACKER_B|HONEST_A|PEER_BINDING|RESULT=|Traceback|ERROR' CROSS_PEER_RACE.log 2>/dev/null | tail -n 260 || true
            echo '--- tail ---'
            tail -n 240 CROSS_PEER_RACE.log 2>/dev/null || true
          } > race-results/${{ matrix.target.name }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-peer-race-${{ matrix.target.name }}
          path: race-results/${{ matrix.target.name }}.txt
          retention-days: 7

  publish:
    needs: cross-peer-race
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-rlv3-6f4a9d
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-peer-race-*
          path: collected
          merge-multiple: true
      - name: Commit matrix
        run: |
          mkdir -p ci/results
          cat collected/*.txt > ci/results/cross-peer-race-matrix.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/results/cross-peer-race-matrix.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record cross-peer transaction race matrix [skip ci]'
            git push origin HEAD:ci-rlv3-6f4a9d
          fi
