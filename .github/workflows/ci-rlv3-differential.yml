name: isolated-chia-rlv3-differential

on:
  push:
    branches: [ci-rlv3-6f4a9d]
    paths-ignore: ['ci/results/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  differential-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-rlv3-6f4a9d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libssl-dev pkg-config
          git clone --filter=blob:none https://github.com/Chia-Network/chia-blockchain.git target
          git -C target checkout d61ed07dee7e9f846b475184db29e885f4699d2a
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './target[dev]'
      - name: Execute table-derived payload corpus
        id: campaign
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/target
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python ci/rlv3_differential_engine.py 2>&1 | tee RLV3_DIFFERENTIAL.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish result
        if: always()
        run: |
          mkdir -p ci/results
          {
            echo "target_commit=d61ed07dee7e9f846b475184db29e885f4699d2a"
            echo "exit_code=${{ steps.campaign.outputs.exit_code }}"
            grep -E 'DISCOVERED_MAPPING|SIGNATURE=|EXERCISED_BOUNDARIES|DIVERGENCE_COUNT|DIVERGENCE=|RESULT=|Traceback|ERROR' RLV3_DIFFERENTIAL.log 2>/dev/null || true
            echo '--- tail ---'
            tail -n 200 RLV3_DIFFERENTIAL.log 2>/dev/null || true
          } > ci/results/rlv3-differential.txt
          cp RLV3_DIFFERENTIAL_RESULTS.json ci/results/rlv3-differential.json 2>/dev/null || true
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/results/rlv3-differential.txt ci/results/rlv3-differential.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record isolated RLV3 differential result [skip ci]'
            git push origin HEAD:ci-rlv3-6f4a9d
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlv3-differential-evidence
          path: |
            RLV3_DIFFERENTIAL.log
            RLV3_DIFFERENTIAL_RESULTS.json
            ci/results/rlv3-differential.txt
          retention-days: 7
